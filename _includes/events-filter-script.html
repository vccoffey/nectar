<script>
  function toIsoDateString(date) {
    const y = date.getFullYear()
    const m = String(date.getMonth() + 1).padStart(2, '0')
    const d = String(date.getDate()).padStart(2, '0')
    return `${y}-${m}-${d}`
  }

  function isIsoDateString(string) {
    return /^\d{4}-\d{2}-\d{2}$/.test(string) && !isNaN(new Date(string))
  }

  ;(function () {
    const pool = document.querySelector('.events-pool')
    const tonightList = document.querySelector('#tonight .events-list')
    const nextList = document.querySelector('#next .events-list')
    const upcomingList = document.querySelector('#upcoming .events-list')
    const container = document.getElementById('events')
    if (!pool || !tonightList || !nextList || !upcomingList || !container)
      return

    const todayStr = toIsoDateString(new Date())

    const events = Array.from(pool.querySelectorAll('.event'))
    pool.innerHTML = ''

    events.forEach((el) => {
      const dateStr = el.getAttribute('data-date')
      if (isIsoDateString(dateStr)) {
        if (dateStr === todayStr) {
          tonightList.appendChild(el)
          return
        }
        if (dateStr < todayStr) return // reject past event
      }
      // if upcoming OR if date is unparsable
      if (tonightList.children.length === 0 && nextList.children.length === 0) {
        nextList.appendChild(el)
        return
      }
      const item = document.createElement('li')
      const date = el.querySelector('time')
      const calendarLinks = el.querySelector('.add-to-calendar')
      if (date) {
        item.className = 'event-meta'
        item.appendChild(date)
        if (calendarLinks) {
          const separator = document.createElement('span')
          separator.innerHTML = '&middot;'
          item.append(separator, calendarLinks)
        }
      } else item.appendChild(el)
      upcomingList.appendChild(item)
    })

    const tonightSection = document.getElementById('tonight')
    const nextSection = document.getElementById('next')
    const upcomingSection = document.getElementById('upcoming')
    const noEventsSection = document.getElementById('no-events')
    if (tonightList.children.length > 0)
      tonightSection.classList.remove('starts-hidden')
    if (nextList.children.length > 0)
      nextSection.classList.remove('starts-hidden')
    if (upcomingList.children.length > 0)
      upcomingSection.classList.remove('starts-hidden')
    if (tonightList.children.length > 0 || nextList.children.length > 0)
      container.classList.remove('starts-hidden')
    else if (noEventsSection) noEventsSection.classList.remove('starts-hidden')
  })()
</script>
